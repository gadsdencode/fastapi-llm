# Azure App Service configuration for FastAPI LLM server
# This file configures Azure App Service deployment settings

# Startup command for Azure App Service
startupCommand: "python startup.py"

# Health check configuration
healthCheckPath: "/ping"
healthCheckEvictionTime: "PT10M"  # 10 minutes
healthCheckInterval: "PT30S"      # 30 seconds

# Azure App Service runtime settings
runtime:
  name: "python"
  version: "3.11"

# Application settings (can be overridden in Azure Portal)
appSettings:
  - name: "AZURE_DEPLOYMENT"
    value: "true"
  - name: "LOAD_MODEL_ON_STARTUP"
    value: "false"
  - name: "PYTHONPATH"
    value: "/app"
  - name: "TRANSFORMERS_CACHE"
    value: "/app/models"
  - name: "HF_HOME"
    value: "/app/models"
  - name: "MODEL_TYPE"
    value: "gguf"
  - name: "OMP_NUM_THREADS"
    value: "2"
  - name: "MKL_NUM_THREADS"
    value: "2"

# Deployment configuration
deployment:
  source:
    type: "github"
  build:
    commands:
      - "pip install --upgrade pip"
      - "pip install -r requirements.txt"
  
# Performance and scaling settings
scaling:
  automaticScaling: false
  instanceCount: 1
  
# Logging configuration
logging:
  level: "info"
  retention: "7d" 