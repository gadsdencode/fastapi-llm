# Fly.io configuration for FastAPI LLM application
app = "your-app-name-here"  # Replace with your actual app name
primary_region = "iad"      # Replace with your preferred region

[build]
  dockerfile = "Dockerfile"

[env]
  PYTHONPATH = "/app"
  PYTHONUNBUFFERED = "1"
  TRANSFORMERS_CACHE = "/app/models"
  HF_HOME = "/app/models"
  MODEL_NAME = "v8karlo/UNCENSORED-TinyDolphin-3x-MoE-Q4_K_M-GGUF"
  MODEL_TYPE = "huggingface"
  PORT = "8000"
  LOAD_MODEL_ON_STARTUP = "false"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 0
  processes = ["app"]

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  timeout = "5s"
  path = "/ping"

[processes]
  app = "uvicorn app.main:app --host 0.0.0.0 --port 8000"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024